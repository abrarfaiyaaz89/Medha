<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A2438">
<title>Medha</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#231E32;--card:#2F2942;--card2:#3A3355;--mid:#5C5470;--txt:#EDEAF5;--sub:#A9A2BD;--acc:#A78BFA;--acc2:#7C6BE0;--amber:#F2B84B;--line:rgba(255,255,255,.09);--b2:#E879F9;--green:#6FCF97;--red:#EB6F6F}
html[data-t=ocean]{--bg:#0F1D2E;--card:#182A40;--card2:#223954;--acc:#38BDF8;--acc2:#2563EB;--b2:#6366F1}
html[data-t=sunset]{--bg:#2B1B2E;--card:#3A2540;--card2:#4A2F52;--acc:#FB7185;--acc2:#F97316;--b2:#F59E0B}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 55% at 50% -8%,color-mix(in srgb,var(--acc) 30%,var(--bg)) 0%,transparent 62%),var(--bg);min-height:100vh;color:var(--txt);font:400 16px/1.5 Inter,sans-serif;padding-bottom:96px}
h1,h2,h3,.ph{font-family:Poppins,sans-serif;font-weight:600}
h1{font-size:26px;line-height:1.2}h2{margin:22px 0 12px;font-size:18px}
#app{max-width:480px;margin:auto;padding:22px 16px}#app>*{animation:up .28s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button,input,select{font:inherit;color:inherit}
.sub,small,label{color:var(--sub)}label{font-size:13px;display:block;margin-bottom:5px}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;margin-bottom:10px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.row:active,.chip:active,.btn:active{transform:scale(.98)}
.row small{display:block;font-size:13px}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:16px;padding:15px 18px;font-weight:600;cursor:pointer;width:100%;box-shadow:0 8px 20px rgba(124,107,224,.35)}
.btn.alt{background:var(--card2);box-shadow:none;border:1px solid var(--line)}.btn:disabled{opacity:.6}
.in{width:100%;background:#272136;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px;font-size:16px;outline:0}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(167,139,250,.25)}.in:disabled{opacity:.5}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #272136 inset;-webkit-text-fill-color:var(--txt)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 4px;margin-bottom:14px}
.sec h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{background:linear-gradient(135deg,#F1EEFB,#CFC6F0);color:#2A2438;border-radius:24px;padding:20px;margin:18px 0 12px;display:block;width:100%;text-align:left;border:0;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.hero small{color:#5C5470}.hero h2{margin:4px 0}
.scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:158px;text-align:left;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--mid);border:2px solid var(--acc);padding:0}
.srch{width:100%;background:#F1EEFB;color:#2A2438;border:0;border-radius:16px;padding:14px 16px;margin:16px 0 8px;font-size:16px;outline:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(35,30,50,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;padding:4px 16px;color:var(--sub);font-size:12px}.nav i{display:block;font-style:normal;font-size:20px}
.nav button.on{color:var(--acc);font-weight:600}
.note{color:var(--amber);font-size:13px;margin:-6px 0 14px}
.empty{background:var(--card);border:1px dashed var(--mid);border-radius:18px;padding:20px;color:var(--sub)}
.back{background:none;border:0;color:var(--acc);margin-bottom:10px;cursor:pointer;font-weight:500}
.toast{position:fixed;left:16px;right:16px;bottom:104px;background:#F1EEFB;color:#2A2438;border-radius:14px;padding:13px 16px;max-width:448px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:9}
.strip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:6px 0 10px}
.spin{width:36px;height:36px;border:4px solid var(--card2);border-top-color:var(--acc);border-radius:50%;margin:42vh auto 0;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pv{text-align:center;margin:6px 0 18px}.pv .av{width:92px;height:92px}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}.bg i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.45;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:300px;height:300px;background:var(--acc);top:-90px;left:-70px}.bg i:nth-child(2){width:260px;height:260px;background:var(--b2);bottom:12%;right:-90px;animation-delay:-5s}.bg i:nth-child(3){width:200px;height:200px;background:var(--amber);bottom:-70px;left:18%;opacity:.22;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,60px) scale(1.2)}}
.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);transform:translateX(-100%);animation:sh 4.5s infinite}@keyframes sh{to{transform:translateX(100%)}}
.logo{animation:flo 3s ease-in-out infinite alternate}@keyframes flo{to{transform:translateY(-10px)}}
.btn:not(:disabled){animation:pul 2.8s infinite}@keyframes pul{50%{box-shadow:0 8px 32px color-mix(in srgb,var(--acc) 75%,transparent)}}
.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}.row:nth-child(4){animation-delay:.15s}.row:nth-child(5){animation-delay:.2s}.row:nth-child(n+6){animation-delay:.25s}
.ok{border-color:var(--green)!important;background:rgba(111,207,151,.2)!important}.bad{border-color:var(--red)!important;background:rgba(235,111,111,.2)!important}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.row:disabled{cursor:default;color:var(--txt)}.ring circle{transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)}
.cf{position:fixed;top:-20px;width:8px;height:14px;border-radius:2px;z-index:99;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="bg"><i></i><i></i><i></i></div><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== STEP: paste your Firebase values here (replace the words in quotes) ===== */
const CFG={apiKey:"AIzaSyBEPx0_PdmfFk3ODhi0kw73M7sWfNV2ob4",authDomain:"medha-7a7aa.firebaseapp.com",projectId:"medha-7a7aa",appId:"1:237258474031:web:b1b6ec7bf7edb2788b3cda"};
/* ================================================================================ */
let FAC=[
{name:"Arts and Humanities",depts:["Bangla", "English", "History", "Philosophy", "Islamic History and Culture", "Arabic", "Islamic Studies", "Dramatics", "Institute of Modern Languages", "Institute of Fine Arts", "Persian Language & Literature", "Pali", "Sanskrit", "Music", "Bangladesh Studies"]},
{name:"Science",depts:["Physics", "Chemistry", "Mathematics", "Statistics", "Applied Chemistry and Chemical Engineering", "Forestry and Environmental Sciences", "Jamal Nazrul Islam Center for Advanced Research (JNICAR)"]},
{name:"Business Administration (BBA)",depts:["Accounting", "Management", "Finance", "Marketing", "Human Resource Management", "Banking and Insurance", "Chittagong University Center for Business Administration", "Bureau of Business Research"]},
{name:"Social Sciences",depts:["Economics", "Political Science", "Sociology", "Public Administration", "Anthropology", "International Relations", "Communication and Journalism", "Criminology and Police Science", "Development Studies", "Social Science Research Institute"]},
{name:"Law",depts:["Law"]},
{name:"Biological Sciences",depts:["Zoology", "Botany", "Geography and Environmental Studies", "Biochemistry and Molecular Biology", "Microbiology", "Soil Science", "Genetic Engineering and Biotechnology", "Psychology", "Pharmacy"]},
{name:"Engineering",depts:["Computer Science & Engineering", "Electrical and Electronic Engineering"]},
{name:"Education",depts:["Physical Education and Sports Science", "Institute of Education And Research"]},
{name:"Marine Sciences and Fisheries",depts:["Marine Sciences", "Oceanography", "Fisheries"]},
{name:"Medicine",depts:["Paediatrics", "Community Ophthalmology"]}];
const DIST=["Select district","Bagerhat","Bandarban","Barguna","Barishal","Bhola","Bogura","Brahmanbaria","Chandpur","Chapai Nawabganj","Chattogram","Chuadanga","Cox's Bazar","Cumilla","Dhaka","Dinajpur","Faridpur","Feni","Gaibandha","Gazipur","Gopalganj","Habiganj","Jamalpur","Jashore","Jhalakathi","Jhenaidah","Joypurhat","Khagrachhari","Khulna","Kishoreganj","Kurigram","Kushtia","Lakshmipur","Lalmonirhat","Madaripur","Magura","Manikganj","Meherpur","Moulvibazar","Munshiganj","Mymensingh","Naogaon","Narail","Narayanganj","Narsingdi","Natore","Netrokona","Nilphamari","Noakhali","Pabna","Panchagarh","Patuakhali","Pirojpur","Rajbari","Rajshahi","Rangamati","Rangpur","Satkhira","Shariatpur","Sherpur","Sirajganj","Sunamganj","Sylhet","Tangail","Thakurgaon"];
const YEARS=["1st Year","2nd Year","3rd Year","4th Year","Masters"],SEMS=[1,2,3,4,5,6,7,8];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const A=x=>esc(JSON.stringify(x));
let auth,db,me,prof,tab="home",nav=[],newPhoto=null;
const G=["name","photo"],B=["age","faculty","dept","major","year","sem","session","sid","mobile","home"];

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function show(h,withNav){app.innerHTML=h+(withNav?`<div class="nav">${[["home","🏠","Home"],["exams","📝","Exams"],["rank","🏆","Rank"],["me","👤","Profile"]].map(([k,i,l])=>`<button class="${tab==k&&!nav.length?"on":""}" onclick="setTab('${k}')"><i>${i}</i>${l}</button>`).join("")}</div>`:"");}
function setTab(k){tab=k;nav=[];render()}
function go(v){nav.push(v);render()}
function back(){nav.pop();render()}
const head=t=>`<button class="back" onclick="back()">← Back</button><h1 style="margin-bottom:14px">${esc(t)}</h1>`;
const row=(t,s,v)=>`<button class="row" onclick="go(${A(v)})"><span>${esc(t)}${s?`<small>${esc(s)}</small>`:""}</span><span>›</span></button>`;
const empty=t=>`<div class="empty">${esc(t)}</div>`;
const left=(at,d)=>Math.max(0,Math.ceil((at+d*864e5-Date.now())/864e5));

if(CFG.apiKey.startsWith("PASTE")){
 show(`<h1>Almost ready</h1><p style="margin-top:10px">Open <b>index.html</b> and paste your Firebase values at the top (the lines under STEP).</p>`)
}else{
 firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(async u=>{me=u;if(!u){prof=null;return login()}
  show(`<div class="spin"></div>`);
  try{
   const [p,c]=await Promise.all([db.collection("users").doc(u.uid).get(),db.collection("catalog").doc("cu").get()]);
   prof=p.exists?p.data():null;
   if(c.exists&&Array.isArray(c.data().faculties))FAC=c.data().faculties;
  }catch(e){show(`<h1>Could not load</h1><p class="sub" style="margin:8px 0 16px">Check your internet and try again.</p><button class="btn" onclick="location.reload()">Try again</button>`);return}
  render();
 });
}

function login(){
 show(`<div style="text-align:center;padding-top:12vh"><img class="logo" src="logo.png" alt="Medha" style="width:240px;border-radius:40px"><p class="ph" style="margin:22px 0 28px">Practice. Get checked. Rank up.</p>
 <button class="btn" onclick="signIn()">Continue with Google</button>
 <p style="margin-top:14px;font-size:13px;color:#a9a3b8">By continuing you agree to the rules in the Profile tab.</p></div>`);
}
async function signIn(){try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){if(e.code=="auth/popup-blocked")auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());else if(e.code!="auth/popup-closed-by-user")toast("Sign in failed. Check your internet and try again.")}}

function render(){
 if(!prof)return show(formPage(),false);
 const v=nav[nav.length-1];
 if(v)return show(page(v),true),v.t=="sub"&&loadSubs(v);
 show(tab=="home"?home():tab=="me"?me_():soon(tab=="exams"?"Exams":"Rank"),true);
}
const soon=t=>`<h1>${t}</h1><div class="empty" style="margin-top:14px">${t=="Rank"?"The daily rank board opens in Version 3.":"AI exams open in Version 2: upload a file, pick Quiz or Broad, and get checked."}</div>`;

function home(){
 const first=(prof.name||"").split(" ")[0],yf=FAC.find(f=>f.name==prof.faculty);
 return `<div class="top"><div><small>Hi ${esc(first)} 👋</small><h1>Welcome back!</h1></div><button class="av ph" onclick="setTab('me')"><img class="av" src="${esc(prof.photo||me.photoURL||"logo.png")}"></button></div>
 <input class="srch" placeholder="Search faculty or department" oninput="find(this.value)"><div id="res"></div>
 <button class="hero" onclick="go(${A({t:"fac",f:prof.faculty})})"><small>Your faculty</small><h2 style="margin:4px 0 0">${esc(prof.faculty)}</h2><small>${yf?yf.depts.length:0} departments ›</small></button>
 <button class="row" onclick="go(${A({t:"sub",f:prof.faculty,d:prof.dept,s:Number(prof.sem)})})"><span>${esc(prof.dept)}<small>Semester ${esc(prof.sem)} subjects</small></span><span>›</span></button>
 <div class="strip">🔥 Streaks and ranks start with exams in Version 2.</div>
 <h2>Other faculties</h2><div class="scroll">${FAC.filter(f=>f.name!=prof.faculty).map(f=>`<button class="chip" onclick="go(${A({t:"fac",f:f.name})})"><b>${esc(f.name)}</b><small style="display:block;color:#a9a3b8">${f.depts.length} departments</small></button>`).join("")}</div>`;
}
function find(q){q=q.trim().toLowerCase();const r=$("#res");if(!q){r.innerHTML="";return}
 const out=[];FAC.forEach(f=>{if(f.name.toLowerCase().includes(q))out.push(row(f.name,"Faculty",{t:"fac",f:f.name}));f.depts.forEach(d=>{if(d.toLowerCase().includes(q))out.push(row(d,f.name,{t:"dept",f:f.name,d}))})});
 r.innerHTML=out.join("")||empty("Nothing found.")}

function page(v){
 if(v.t=="fac"){const f=FAC.find(x=>x.name==v.f)||{depts:[]};return head(v.f)+(f.depts.length?f.depts.map(d=>row(d,"",{t:"dept",f:v.f,d})).join(""):empty("Departments for this faculty are not added yet."))}
 if(v.t=="dept")return head(v.d)+SEMS.map(s=>row("Semester "+s,v.d==prof.dept&&s==prof.sem?"Your semester":"",{t:"sub",f:v.f,d:v.d,s})).join("");
 if(v.t=="sub")return head(v.d+" · Semester "+v.s)+`<div id="subs"></div><h2>Add a subject</h2><input id="ns" class="in" maxlength="70" placeholder="Subject name, e.g. Statistics"><button class="btn" onclick='addSub(${A(v)})'>Add subject</button>`;
 if(v.t=="subj")return head(v.n)+'<div id="ex">'+exSetup()+'</div>';
 if(v.t=="edit")return head("Edit profile")+formPage(true);
 if(v.t=="rules")return head("Rules")+`<div class="empty">• Upload only material you are allowed to share.<br>• No full paid books and no leaked exams.<br>• No insults, fake accounts or cheating tricks.<br>• AI marks are estimates, not official results.<br>• Reported posts can be removed.</div>`;
}
async function loadSubs(v){
 try{const s=await db.collection("subjects").where("f","==",v.f).where("d","==",v.d).where("s","==",v.s).get();const el=$("#subs");if(!el)return;
 el.innerHTML=s.empty?empty("No subjects yet. Add the first one below."):s.docs.map(x=>row(x.data().n,"",{t:"subj",n:x.data().n})).join("")}catch(e){toast("Could not load subjects")}
}
async function addSub(v){const n=$("#ns").value.trim();if(!n)return toast("Type a subject name first.");
 try{await db.collection("subjects").add({f:v.f,d:v.d,s:v.s,n,by:me.uid});$("#ns").value="";loadSubs(v)}catch(e){toast("Could not add: "+e.code)}}

function me_(){
 return `<div style="text-align:center;margin-bottom:16px"><img class="av" style="width:96px;height:96px" src="${esc(prof.photo||me.photoURL||"logo.png")}"><h1 style="margin-top:10px">${esc(prof.name)}</h1><small>${esc(prof.dept)} · ${esc(prof.faculty)}</small></div>
 ${[["University",prof.university],["Year",prof.year],["Semester",prof.sem],["Session",prof.session],["Student ID",prof.sid],["Age",prof.age],["Major",prof.major],["Mobile",prof.mobile],["Home town",prof.home]].map(([k,v])=>`<div class="row" style="cursor:default"><small>${k}</small><span>${esc(v||"-")}</span></div>`).join("")}
 <small style="display:block;margin:0 0 12px">Mobile and ID are private. Only you can see them.</small>
 <button class="btn" onclick="go({t:'edit'})" style="margin-bottom:10px">Edit profile</button>
 <button class="btn alt" onclick="theme()" style="margin-bottom:10px">🎨 Change theme</button>
 <button class="btn alt" onclick="go({t:'rules'})" style="margin-bottom:10px">Rules</button>
 <button class="btn alt" onclick="auth.signOut()">Sign out</button>`;
}

function formPage(editing){
 const p=prof||{},lockA=editing&&Date.now()-p.aAt<7*864e5,lockB=editing&&Date.now()-p.bAt<30*864e5;
 newPhoto=null;
 const f=(id,l,v,lock,ex="")=>`<div><label>${l}</label><input class="in" id="${id}" value="${esc(v)}" ${lock?"disabled":""} ${ex}></div>`;
 const sel=(id,l,opts,v,lock,fn="")=>`<div><label>${l}</label><select class="in" id="${id}" ${lock?"disabled":""} ${fn}>${opts.map(o=>`<option ${String(o)==String(v)?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
 const dl=(FAC.find(x=>x.name==(p.faculty||FAC[0].name))||{depts:[]}).depts;
 return (editing?"":`<h1>Welcome to Medha</h1><p class="sub" style="margin:4px 0 18px">Set up your profile in one minute.</p>`)+
 `<div class="pv"><img id="pv" class="av" src="${esc(p.photo||me.photoURL||"logo.png")}"><br>${lockA?"":`<label style="cursor:pointer;color:var(--acc);margin-top:8px">Change photo<input type="file" accept="image/*" hidden onchange="pick(event)"></label>`}</div>`+
 `<div class="sec"><h3>Basic</h3>${f("name","Name",p.name||me.displayName||"",lockA)}${lockA?`<div class="note">Name and photo unlock in ${left(p.aAt,7)} day(s).</div>`:""}<div class="g2">${f("age","Age",p.age||"",lockB,'type="number" min="10" max="80" inputmode="numeric"')}${f("session","Session",p.session||"",lockB,'placeholder="2025-26"')}</div></div>`+
 `<div class="sec"><h3>University</h3>${f("university","University","University of Chittagong",true)}${sel("faculty","Faculty",FAC.map(x=>x.name),p.faculty,lockB,'onchange="fillDl()"')}<div><label>Department</label><input class="in" id="dept" list="dl" value="${esc(p.dept||"")}" ${lockB?"disabled":""}><datalist id="dl">${dl.map(d=>`<option>${esc(d)}</option>`).join("")}</datalist></div>${f("major","Major (optional)",p.major||"",lockB)}<div class="g2">${sel("year","Year",YEARS,p.year,lockB)}${sel("sem","Semester",SEMS,p.sem,lockB)}</div>${f("sid","Student ID",p.sid||"",lockB,'inputmode="numeric"')}</div>`+
 `<div class="sec"><h3>Contact</h3>${f("mobile","Mobile",p.mobile||"",lockB,'type="tel" inputmode="tel"')}${sel("home","Home town (district)",DIST,p.home,lockB)}</div>`+
 (lockB?`<div class="note">Other details unlock in ${left(p.bAt,30)} day(s).</div>`:"")+
 `<button id="sv" class="btn" onclick="save()">Save profile</button><div style="height:24px"></div>`;
}
function fillDl(){const f=FAC.find(x=>x.name==$("#faculty").value);$("#dl").innerHTML=(f?f.depts:[]).map(d=>`<option>${esc(d)}</option>`).join("")}
function pick(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas"),m=Math.min(i.width,i.height);c.width=c.height=240;c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,240,240);newPhoto=c.toDataURL("image/jpeg",.8);$("#pv").src=newPhoto};i.src=r.result};r.readAsDataURL(f)}

async function save(){
 const g=id=>($("#"+id).value||"").trim(),d={name:g("name"),photo:newPhoto||(prof&&prof.photo)||me.photoURL||"",age:g("age"),faculty:g("faculty"),dept:g("dept"),major:g("major"),year:g("year"),sem:g("sem"),session:g("session"),sid:g("sid"),mobile:g("mobile"),home:g("home")=="Select district"?"":g("home")};
 if(!d.name)return toast("Please enter your name.");
 if(!d.dept)return toast("Please choose your department.");
 if(d.age&&(d.age<10||d.age>80))return toast("Please enter a valid age.");
 if(d.mobile&&!/^(\+?88)?01\d{9}$/.test(d.mobile))return toast("Enter a valid mobile number, like 017XXXXXXXX.");
 const b=$("#sv");b.disabled=true;b.textContent="Saving…";
 const now=Date.now(),first=!prof,chA=first||G.some(k=>d[k]!==prof[k]),chB=first||B.some(k=>d[k]!==prof[k]);
 if(!first&&chA&&now-prof.aAt<7*864e5)return toast("Name and photo are still locked.");
 if(!first&&chB&&now-prof.bAt<30*864e5)return toast("Other details are still locked.");
 const out={...(prof||{}),...d,university:"University of Chittagong",uid:me.uid,aAt:chA?now:prof.aAt,bAt:chB?now:prof.bAt};
 try{await db.collection("users").doc(me.uid).set(out);prof=out;nav=[];tab="home";toast("Saved");render()}catch(e){b.disabled=false;b.textContent="Save profile";toast("Could not save. Check your internet and try again.")}
}
let EX=null,exFile=null;const today=()=>new Date().toISOString().slice(0,10);
function theme(){const T=["","ocean","sunset"],n=T[(T.indexOf(document.documentElement.dataset.t||"")+1)%3];document.documentElement.dataset.t=n;try{localStorage.setItem("t",n)}catch(e){}}
try{document.documentElement.dataset.t=localStorage.getItem("t")||""}catch(e){}
function exSetup(){return `<div class="sec"><h3>Make an exam</h3><label>Study file (PDF, image or text, max 4 MB)</label><input class="in" type="file" accept=".pdf,image/*,.txt" onchange="exFile=this.files[0]"><div class="g2"><div><label>Type</label><select class="in" id="xt"><option value="q">Quiz (1 mark)</option><option value="b">Broad (10 mark)</option></select></div><div><label>Questions</label><select class="in" id="xn"><option>3</option><option selected>5</option><option>10</option></select></div></div></div><button class="btn" onclick="startEx()">Start exam ✨</button><small style="display:block;margin-top:10px">AI marks are estimates. Limit: 5 exams per day.</small>`}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
async function startEx(){
 if(!exFile)return toast("Choose a file first.");if(exFile.size>4e6)return toast("File is too big. Max 4 MB.");
 if(prof.exDay==today()&&prof.exN>=5)return toast("Daily limit reached. Come back tomorrow.");
 const t=$("#xt").value,n=$("#xn").value,box=$("#ex");box.innerHTML='<div class="spin" style="margin-top:18vh"></div><p class="sub" style="text-align:center;margin-top:14px">Medha is reading your file…</p>';
 try{const p=t=="q"?`Write ${n} multiple-choice questions (1 mark each) from this study material for a university exam. Return JSON {"qs":[{"q":"","o":["","","",""],"a":0,"w":"short reason"}]} where a is the index of the right option.`:`Write ${n} broad questions (10 marks each, OBE style) from this study material. Return JSON {"qs":[{"q":""}]}.`;
  const r=await askAI([{inlineData:{mimeType:exFile.type||"text/plain",data:await b64(exFile)}},p]);if(!r.qs||!r.qs.length)throw 0;
  EX={t,qs:r.qs,i:0,s:0};const d=today();prof.exN=prof.exDay==d?(prof.exN||0)+1:1;prof.exDay=d;db.collection("users").doc(me.uid).set({exDay:d,exN:prof.exN},{merge:true}).catch(()=>{});exView();
 }catch(e){box.innerHTML=exSetup();const m=typeof askAI=="undefined"?"AI code did not load (the Firebase AI script is blocked or the version is wrong)":String(e&&(e.message||e.code)||e||"unknown");toast("Exam error: "+m.slice(0,230))}}
function exView(){const q=EX.qs[EX.i];
 $("#ex").innerHTML=`<small>Question ${EX.i+1} of ${EX.qs.length}</small><div style="height:6px;background:var(--card2);border-radius:9px;margin:6px 0 16px"><div style="height:6px;width:${EX.i/EX.qs.length*100}%;background:var(--acc);border-radius:9px"></div></div><h2 style="margin-top:0">${esc(q.q)}</h2>`+(EX.t=="q"?q.o.map((o,k)=>`<button class="row" onclick="pickO(${k})">${esc(o)}</button>`).join(""):`<textarea id="ba" class="in" rows="9" placeholder="Write your answer…"></textarea><button class="btn" onclick="gradeB()">Submit answer</button>`)}
function pickO(k){const q=EX.qs[EX.i],bs=[...document.querySelectorAll("#ex .row")];if(bs[0].disabled)return;bs.forEach((b,j)=>{b.disabled=true;if(j==q.a)b.classList.add("ok")});if(k==q.a)EX.s++;else bs[k].classList.add("bad","shake");
 $("#ex").insertAdjacentHTML("beforeend",`<div class="empty" style="margin:8px 0 14px">${esc(q.w||"")}</div><button class="btn" onclick="nextQ()">Next →</button>`)}
function nextQ(){EX.i++;EX.i<EX.qs.length?exView():exDone()}
async function gradeB(){const a=$("#ba").value.trim();if(a.length<20)return toast("Write a longer answer first.");const b=$("#ex .btn");b.disabled=true;b.textContent="Checking like a professor…";
 try{const r=await askAI([`You are a fair university professor. Question: ${EX.qs[EX.i].q}\nStudent answer: ${a}\nGrade out of 10. Point out only the main errors, not tiny ones. Return JSON {"mark":0,"good":"","fix":["",""],"study":""}`]);
  const m=Math.max(0,Math.min(10,Number(r.mark)||0));EX.s+=m;
  $("#ex").innerHTML=`<h2 style="margin-top:0">${m}/10 <small>AI estimated</small></h2><div class="sec"><h3>Good</h3><p style="margin-bottom:14px">${esc(r.good)}</p></div><div class="sec"><h3>Fix these</h3><p style="margin-bottom:14px">${(r.fix||[]).map(x=>"• "+esc(x)).join("<br>")}</p></div><div class="sec"><h3>Study next</h3><p style="margin-bottom:14px">${esc(r.study)}</p></div><button class="btn" onclick="nextQ()">Next →</button>`;
 }catch(e){b.disabled=false;b.textContent="Submit answer";toast("Could not check. Try again.")}}
function exDone(){const tot=EX.t=="q"?EX.qs.length:EX.qs.length*10,pc=Math.round(EX.s/tot*100),C=2*Math.PI*52;
 $("#ex").innerHTML=`<div style="text-align:center"><svg class="ring" width="150" height="150" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--card2)" stroke-width="10"/><circle id="rg" cx="60" cy="60" r="52" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" fill="var(--txt)" font-size="26" font-family="Poppins">${pc}%</text></svg><h2>${EX.s} / ${tot}</h2><p class="sub">AI estimated. Keep practising!</p></div><button class="btn" style="margin-top:16px" onclick="$('#ex').innerHTML=exSetup()">New exam</button>`;
 setTimeout(()=>{const g=$("#rg");if(g)g.style.strokeDashoffset=C*(1-pc/100)},80);if(pc>=70)confetti()}
function confetti(){for(let i=0;i<46;i++){const d=document.createElement("i");d.className="cf";d.style.cssText=`left:${Math.random()*100}vw;background:${["#F2B84B","#A78BFA","#6FCF97","#EB6F6F","#38BDF8"][i%5]};animation-delay:${Math.random()*.6}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAI,getGenerativeModel,GoogleAIBackend} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";
let M;window.askAI=async parts=>{M=M||getGenerativeModel(getAI(initializeApp(CFG,"ai"),{backend:new GoogleAIBackend()}),{model:"gemini-2.5-flash",generationConfig:{responseMimeType:"application/json"}});return JSON.parse((await M.generateContent(parts)).response.text())};
</script>
</body></html>
